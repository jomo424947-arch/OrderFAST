<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>FASTorder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #161920;
      color: #FFFBF5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: rgba(255, 164, 28, 0.15);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: pulseGlow 2s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.85); opacity: 0.6; }
      to { transform: scale(1.15); opacity: 1; }
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      transform: translateY(-16px);
    }

    .logo-box {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logoPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(255, 164, 28, 0.45));
    }

    .logo-title {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-top: 16px;
      line-height: 1;
      animation: textSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      opacity: 0;
    }

    .logo-title .fast {
      color: #FFA41C;
      filter: drop-shadow(0 2px 14px rgba(255, 164, 28, 0.4));
    }

    .logo-title .order {
      color: #FFFBF5;
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(255, 251, 245, 0.7);
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 8px;
      animation: textSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
      opacity: 0;
    }

    .badge-slogan {
      margin-top: 18px;
      padding: 6px 16px;
      background: rgba(255, 164, 28, 0.15);
      border: 1px solid rgba(255, 164, 28, 0.3);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #FFA41C;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: textSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
      opacity: 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #FFA41C;
      border-radius: 50%;
      animation: pulseGlow 0.8s infinite alternate;
    }

    @keyframes logoPop {
      0% { transform: scale(0.85); opacity: 0; filter: blur(8px); }
      100% { transform: scale(1); opacity: 1; filter: blur(0); }
    }

    @keyframes textSlide {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="stage">
    <div class="logo-box">
      <img src="logo_trans.png" alt="FASTorder" />
    </div>
    <div class="logo-title">
      <span class="fast">FAST</span><span class="order">order</span>
    </div>
    <span class="tagline">ORDER • WAIT • ENJOY</span>
    <div class="badge-slogan">
      <span class="dot"></span>
      <span>أسرع طلب في حرم جامعتك ⚡</span>
    </div>
  </div>

  <script>
    // Seamless redirect to live site if online
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.location.href = 'https://www.fast0rder.online';
      }, 1800);
    });
  </script>
</body>
</html>
